<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GERD Finder V5 - Login</title>
<style>
body{font-family:system-ui,sans-serif;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px}
.card{background:#1e293b;padding:32px;border-radius:16px;width:100%;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
h1{margin:0 0 8px;font-size:22px}
p{color:#94a3b8;margin:0 0 24px;font-size:14px}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;margin-bottom:12px;box-sizing:border-box}
button{width:100%;padding:12px;background:#22c55e;color:#000;font-weight:700;border:none;border-radius:10px;cursor:pointer;font-size:16px}
button:disabled{opacity:.6}
.small{font-size:12px;color:#64748b;margin-top:12px;text-align:center}
a{color:#22c55e}
</style>
</head>
<body>
<div class="card">
<h1>GERD Finder V5</h1>
<p>Login pakai Email & Order ID FO26 (Google Sheet - Fix CORS)</p>
<input id="email" type="email" placeholder="Email (contoh: kamu@gmail.com)" value="test@example.com"/>
<input id="orderId" type="text" placeholder="Order ID (contoh: FO26U7LRM3BG)" value="test-1793628369"/>
<button id="loginBtn" onclick="doLogin()">Login</button>
<div class="small">Backend: Google Sheet (Simple kayak HPP)<br>Fix: JSONP biar gak Failed to fetch<br><a href="https://docs.google.com/spreadsheets" target="_blank">Buka Google Sheet</a></div>
</div>

<script>
const SHEET_API = "https://gerd-finder-api-hlm9.vercel.app/api/check-license";
const VERCEL_API = "https://gerd-finder-api-hlm9.vercel.app/api/check-license";

// JSONP function untuk bypass CORS GitHub Pages -> Google Apps Script
function jsonpFetch(url){
  return new Promise((resolve, reject) => {
    const callbackName = 'cb_' + Date.now() + '_' + Math.floor(Math.random()*10000);
    window[callbackName] = function(data){
      delete window[callbackName];
      document.body.removeChild(script);
      resolve(data);
    };
    const script = document.createElement('script');
    script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + callbackName;
    script.onerror = function(){ 
      delete window[callbackName];
      document.body.removeChild(script);
      reject(new Error('Failed to fetch JSONP'));
    };
    document.body.appendChild(script);
  });
}

async function doLogin(){
  const email = document.getElementById('email').value.trim();
  const orderId = document.getElementById('orderId').value.trim();
  const btn = document.getElementById('loginBtn');
  
  if(!email || !orderId){ alert('Isi Email & Order ID dulu'); return; }
  
  btn.disabled = true;
  btn.textContent = 'Mengecek di Google Sheet...';
  
  try{
    const url = SHEET_API + "?action=check&email=" + encodeURIComponent(email) + "&order_id=" + encodeURIComponent(orderId);
    console.log('Checking (JSONP):', url);
    const data = await jsonpFetch(url);
    console.log('Result:', data);
    
    if(data.valid){
      localStorage.setItem('gerd_license', data.license_key);
      localStorage.setItem('gerd_email', data.email);
      localStorage.setItem('gerd_order_id', data.order_id);
      localStorage.setItem('gerd_name', data.name || '');
      alert('✅ Login berhasil! License: ' + data.license_key);
      btn.textContent = 'Berhasil! License: ' + data.license_key;
      // window.location.href = 'dashboard.html';
    } else {
      alert('❌ Order tidak ditemukan.\nPesan: ' + (data.message || ''));
      btn.disabled = false;
      btn.textContent = 'Login';
    }
  }catch(e){
    console.error(e);
    alert('Gagal konek: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Login';
  }
}
</script>
</body>
</html>
